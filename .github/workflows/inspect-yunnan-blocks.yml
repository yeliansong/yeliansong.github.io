name: Inspect Yunnan Lark blocks
on:
  push:
    paths:
      - .github/workflows/inspect-yunnan-blocks.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect non-text document blocks
        env:
          FEISHU_APP_ID: ${{ secrets.LARK_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse
          from scripts.sync_feishu import request, tenant_token, resolve_wiki_document, api_base

          platform = "lark"
          token = tenant_token(platform)
          document_id = resolve_wiki_document("DUsMwFJgYiyCylkSssylYojCg4b", token, platform)
          blocks, page_token = [], None
          while True:
              params = {"page_size": 500}
              if page_token:
                  params["page_token"] = page_token
              url = f"{api_base(platform)}/open-apis/docx/v1/documents/{document_id}/blocks?{urllib.parse.urlencode(params)}"
              data = request(url, token=token)["data"]
              blocks.extend(data.get("items", []))
              if not data.get("has_more"):
                  break
              page_token = data["page_token"]

          for index, block in enumerate(blocks):
              kind = block.get("block_type")
              if kind not in set(range(1, 16)) | {22}:
                  print(json.dumps({"index": index, "block_type": kind, "block": block}, ensure_ascii=False))
          PY
