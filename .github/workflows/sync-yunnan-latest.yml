name: Sync latest Yunnan travel article
on:
  push:
    paths:
      - .github/workflows/sync-yunnan-latest.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Import and optimize latest Lark document
        env:
          FEISHU_APP_ID: ${{ secrets.LARK_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          pip install Pillow imageio-ffmpeg
          python scripts/sync_feishu.py \
            --platform lark \
            --wiki-token DUsMwFJgYiyCylkSssylYojCg4b \
            --slug 2026-10-11-yunnan-travel \
            --category "生活与阅读" \
            --tags "旅行, 云南, 生活" \
            --summary "十天里从昆明、大理、丽江走到香格里拉，风景之外，一个人的旅行也把我带回了对生活、年龄与幸福的重新思考。"
          python scripts/optimize_media.py 2026-10-11-yunnan-travel
          python scripts/rebuild_site.py
      - name: Publish update
        run: |
          git config user.name "blog-publisher[bot]"
          git config user.email "blog-publisher[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "content: sync latest Yunnan travel article"
          git push
